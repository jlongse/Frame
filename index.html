<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoBox Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        color: #222;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    h1 {
        margin: 0 0 20px;
        font-size: 28px;
    }

    h2 {
        margin: 0 0 14px;
        font-size: 20px;
    }

    .panel {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 18px;
        background: #fff;
    }

    .field {
        margin-bottom: 14px;
    }

    .field label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
    }

    input,
    select,
    textarea {
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px 11px;
        font: inherit;
        background: #fff;
        color: #222;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    .hidden {
        display: none !important;
    }

    button {
        border: 1px solid #d2d2d2;
        border-radius: 6px;
        padding: 9px 13px;
        cursor: pointer;
        font-weight: 600;
        background: #f7f7f7;
        color: #333;
        margin-right: 6px;
        margin-bottom: 6px;
        box-shadow: none;
        transition:
            background .15s ease,
            border-color .15s ease,
            color .15s ease,
            transform .1s ease;
    }

    button:hover {
        background: #ececec;
        border-color: #bdbdbd;
    }

    button:active {
        transform: translateY(1px);
    }

    button.secondary {
        background: #f7f7f7;
        color: #555;
        border-color: #d2d2d2;
    }

    button.success {
        background: #eeeeee;
        color: #222;
        border-color: #c8c8c8;
    }

    button.danger {
        background: #f7f7f7;
        color: #555;
        border-color: #d2d2d2;
    }

    button.format {
        background: #f7f7f7;
        color: #444;
        border-color: #d2d2d2;
    }

    .actions {
        margin-top: 10px;
    }

    .status {
        min-height: 20px;
        margin-top: 8px;
        font-size: 13px;
        color: #555;
    }

    .hint {
        font-size: 12px;
        color: #777;
        margin-top: 5px;
        line-height: 1.4;
    }

    /*
     * ============================================================
     * LAYOUT
     * ============================================================
     */

    .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 430px);
        gap: 18px;
        align-items: start;
    }

    .main-column {
        min-width: 0;
    }

    .elements-panel {
        min-width: 0;
        position: sticky;
        top: 16px;
        height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .elements-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 4px;
        overscroll-behavior: contain;
    }

    #itemsList {
        min-height: 20px;
    }

    /*
     * ============================================================
     * ELEMENTOS
     * ============================================================
     */

    .element-entry {
        position: relative;
        width: 100%;
        margin-bottom: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
    }

    .element-entry.dragging {
        z-index: 1000;
    }

    .item {
        position: relative;
        background: #fafafa;
        border: 1px solid #ddd;
        border-radius: 9px;
        padding: 12px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transform: scale(1);
        transition:
            opacity .15s ease,
            transform .18s ease,
            border-color .15s ease,
            background .15s ease,
            box-shadow .18s ease;
    }

    .item:hover {
        background: #fdfdfd;
        border-color: #cfcfcf;
    }

    .item.dragging {
        opacity: .95;
        background: #fff;
        border-color: #999;
        transform: scale(1.035) translateY(-2px);
        box-shadow:
            0 14px 30px rgba(0,0,0,.18),
            0 3px 8px rgba(0,0,0,.10);
        z-index: 1000;
    }

    .item.dragging::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 9px;
        pointer-events: none;
        box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
    }

    .item-info {
        flex: 1;
        min-width: 0;
    }

    .item-title {
        font-weight: 700;
        margin-bottom: 3px;
    }

    .item-description {
        font-size: 13px;
        color: #666;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .item-actions {
        flex-shrink: 0;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 2px;
    }

    /*
     * Iconos planos.
     * No tienen aspecto de botón grande.
     */

    .item-actions button {
        width: 27px;
        height: 27px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #555;
        font-size: 17px;
        line-height: 27px;
        font-weight: 400;
        text-align: center;
        box-shadow: none;
    }

    .item-actions button:hover {
        background: #ededed;
        border: 0;
        color: #222;
    }

    .item-actions button:active {
        transform: translateY(1px);
    }

    .item-actions .delete-button:hover {
        color: #333;
    }

    /*
     * + FUERA DEL ELEMENTO, A LA DERECHA
     */

    .insert-after {
        position: absolute;
        right: -32px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #666;
        font-size: 21px;
        font-weight: 400;
        line-height: 24px;
        text-align: center;
        cursor: pointer;
        box-shadow: none;
    }

    .insert-after:hover {
        background: #f0f0f0;
        border: 0;
        color: #222;
    }

    .element-entry.dragging .insert-after {
        visibility: hidden;
    }

    /*
     * ELEMENTO VACÍO
     */

    .item.blank-item {
        background: #fff;
        border-style: dashed;
        border-color: #c8c8c8;
    }

    .item.blank-item .item-title {
        color: #666;
        font-weight: 600;
    }

    .item.blank-item .item-description {
        color: #999;
    }

    /*
     * PLACEHOLDER DE ARRASTRE
     */

    .drag-placeholder {
        box-sizing: border-box;
        border: 2px dashed #c7c7c7;
        border-radius: 9px;
        background: #f5f5f5;
        margin-bottom: 8px;
        position: relative;
        opacity: .95;
        transition:
            height .15s ease,
            opacity .15s ease;
    }

    .drag-placeholder::before {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        top: 50%;
        height: 2px;
        transform: translateY(-50%);
        background: #d0d0d0;
        border-radius: 999px;
    }

    body.drag-active {
        user-select: none;
        -webkit-user-select: none;
        cursor: grabbing;
    }

    /*
     * ============================================================
     * OUTPUT
     * ============================================================
     */

    #output {
        min-height: 300px;
        font-family: Consolas, Monaco, monospace;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre;
    }

    .empty {
        color: #888;
        font-size: 14px;
        padding: 8px 0;
    }

    .two-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    @media (max-width: 900px) {

        .workspace {
            grid-template-columns: 1fr;
        }

        .elements-panel {
            position: static;
            height: auto;
            max-height: 60vh;
        }

        .elements-list {
            max-height: calc(60vh - 120px);
        }
    }

    @media (max-width: 750px) {

        .two-columns {
            grid-template-columns: 1fr;
        }

        body {
            padding: 14px;
        }

        .item {
            align-items: flex-start;
        }

        .item-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .insert-after {
            right: -27px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>PhotoBox Generator</h1>

    <div class="workspace">

        <!-- ======================================================
             COLUMNA PRINCIPAL
             ====================================================== -->

        <div class="main-column">

            <div class="panel">

                <h2>Añadir elemento</h2>

                <div class="field">
                    <label for="elementType">Tipo de elemento</label>
                    <select id="elementType">

                        <!-- Se mantiene Polaroid como valor inicial de V1 -->
                        <option value="polaroid">Polaroid</option>

                        <option value="sticky">Sticky Note</option>

                        <option value="sticky-fecha">
                            Sticky Note + Fecha
                        </option>

                        <option value="sticky-png">
                            Sticky PNG
                        </option>

                        <option value="ticket">
                            Ticket
                        </option>

                        <option value="png-frame">
                            PNG Frame
                        </option>

                        <option value="diary">
                            Diary Notes
                        </option>

                        <option value="film-strip">
                            Film Strip
                        </option>

                        <!-- Solo se utiliza internamente al editar un blank -->
                        <option value="__blank__" hidden>
                            Selecciona un tipo...
                        </option>

                    </select>
                </div>


                <!-- POLAROID -->

                <div class="type-fields" id="fields-polaroid">

                    <div class="field">
                        <label for="polaroidImage">
                            URL de la imagen
                        </label>

                        <input
                            id="polaroidImage"
                            type="text"
                            placeholder="https://..."
                        >
                    </div>


                    <div class="field">
                        <label for="polaroidAlt">
                            ALT de la imagen
                        </label>

                        <input
                            id="polaroidAlt"
                            type="text"
                            placeholder="Descripción de la imagen"
                        >
                    </div>


                    <div class="field">
                        <label for="polaroidText">
                            Texto de la Polaroid
                        </label>

                        <input
                            id="polaroidText"
                            type="text"
                            placeholder="Texto"
                        >

                        <div class="hint">
                            La Polaroid lleva una sola línea de texto.
                        </div>
                    </div>

                </div>


                <!-- STICKY -->

                <div
                    class="type-fields hidden"
                    id="fields-sticky"
                >

                    <div class="field">

                        <label for="stickyText">
                            Texto del Sticky Note
                        </label>

                        <textarea
                            id="stickyText"
                            placeholder="Texto"
                        ></textarea>

                    </div>

                </div>


                <!-- STICKY FECHA -->

                <div
                    class="type-fields hidden"
                    id="fields-sticky-fecha"
                >

                    <div class="field">

                        <label for="stickyFechaText">
                            Texto del Sticky Note
                        </label>

                        <textarea
                            id="stickyFechaText"
                            placeholder="Texto"
                        ></textarea>

                    </div>


                    <div class="field">

                        <label for="stickyFechaDate">
                            Fecha
                        </label>

                        <input
                            id="stickyFechaDate"
                            type="text"
                            placeholder="01/01/2026"
                        >

                    </div>

                </div>


                <!-- STICKY PNG -->

                <div
                    class="type-fields hidden"
                    id="fields-sticky-png"
                >

                    <div class="field">

                        <label for="stickyPngImage">
                            URL del PNG
                        </label>

                        <input
                            id="stickyPngImage"
                            type="text"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="field">

                        <label for="stickyPngAlt">
                            ALT del PNG
                        </label>

                        <input
                            id="stickyPngAlt"
                            type="text"
                            placeholder="Descripción"
                        >

                    </div>

                </div>


                <!-- TICKET -->

                <div
                    class="type-fields hidden"
                    id="fields-ticket"
                >

                    <div class="field">

                        <label for="ticketImage">
                            URL de la imagen
                        </label>

                        <input
                            id="ticketImage"
                            type="text"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="field">

                        <label for="ticketAlt">
                            ALT de la imagen
                        </label>

                        <input
                            id="ticketAlt"
                            type="text"
                            placeholder="Descripción"
                        >

                    </div>

                </div>


                <!-- PNG FRAME -->

                <div
                    class="type-fields hidden"
                    id="fields-png-frame"
                >

                    <div class="field">

                        <label for="pngFrameImage">
                            URL de la imagen
                        </label>

                        <input
                            id="pngFrameImage"
                            type="text"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="field">

                        <label for="pngFrameAlt">
                            ALT de la imagen
                        </label>

                        <input
                            id="pngFrameAlt"
                            type="text"
                            placeholder="Descripción"
                        >

                    </div>


                    <div class="field">

                        <label for="pngFrameScale">
                            Escala
                        </label>

                        <input
                            id="pngFrameScale"
                            type="number"
                            step="0.1"
                            value="1.4"
                        >

                    </div>

                </div>


                <!-- DIARY -->

                <div
                    class="type-fields hidden"
                    id="fields-diary"
                >

                    <div class="field">

                        <label for="diaryText">
                            Contenido del Diary Notes
                        </label>

                        <textarea
                            id="diaryText"
                            placeholder="Escribe cada párrafo en una línea diferente. Escribe ... o … en una línea para crear una separación."
                        ></textarea>


                        <div class="hint">
                            Una línea con
                            <strong>...</strong> o
                            <strong>…</strong>
                            se convierte directamente en
                            <strong>&lt;hr&gt;</strong>.
                            El &lt;hr&gt; queda fuera de los párrafos.
                        </div>

                    </div>

                </div>


                <!-- FILM STRIP -->

                <div
                    class="type-fields hidden"
                    id="fields-film-strip"
                >

                    <div class="field">

                        <label for="filmName">
                            Nombre / comentario del Film Strip
                        </label>

                        <input
                            id="filmName"
                            type="text"
                            placeholder="Nombre o comentario"
                        >

                    </div>


                    <div class="field">

                        <label for="filmImage1">
                            Imagen 1
                        </label>

                        <input
                            id="filmImage1"
                            type="text"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="field">

                        <label for="filmAlt1">
                            ALT 1
                        </label>

                        <input
                            id="filmAlt1"
                            type="text"
                            placeholder="Descripción"
                        >

                    </div>


                    <div class="field">

                        <label for="filmImage2">
                            Imagen 2
                        </label>

                        <input
                            id="filmImage2"
                            type="text"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="field">

                        <label for="filmAlt2">
                            ALT 2
                        </label>

                        <input
                            id="filmAlt2"
                            type="text"
                            placeholder="Descripción"
                        >

                    </div>


                    <div class="field">

                        <label for="filmImage3">
                            Imagen 3
                        </label>

                        <input
                            id="filmImage3"
                            type="text"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="field">

                        <label for="filmAlt3">
                            ALT 3
                        </label>

                        <input
                            id="filmAlt3"
                            type="text"
                            placeholder="Descripción"
                        >

                    </div>

                </div>


                <div class="actions">

                    <button
                        id="addButton"
                        class="success"
                    >
                        Añadir elemento
                    </button>


                    <button
                        id="cancelEditButton"
                        class="secondary hidden"
                    >
                        Cancelar edición
                    </button>

                </div>


                <div
                    id="formStatus"
                    class="status"
                ></div>

            </div>


            <!-- HTML GENERADO -->

            <div class="panel">

                <h2>HTML generado</h2>

                <textarea
                    id="output"
                    readonly
                ></textarea>


                <div class="actions">

                    <button
                        id="copyButton"
                        class="success"
                    >
                        Copiar HTML
                    </button>


                    <button
                        id="downloadButton"
                        class="secondary"
                    >
                        Descargar HTML
                    </button>

                </div>


                <div
                    id="outputStatus"
                    class="status"
                ></div>

            </div>


            <!-- IMPORTAR -->

            <div class="panel">

                <h2>Importar HTML existente</h2>

                <textarea
                    id="importInput"
                    placeholder="Pega aquí un documento HTML, una sección .tiny-photos, un <ul> o elementos <li>..."
                ></textarea>


                <div class="actions">

                    <button
                        id="importButton"
                        class="success"
                    >
                        Importar HTML
                    </button>

                </div>


                <div
                    id="importStatus"
                    class="status"
                ></div>

            </div>

        </div>


        <!-- ======================================================
             COLUMNA ELEMENTOS
             ====================================================== -->

        <div class="panel elements-panel">

            <h2>Elementos activos</h2>

            <div class="hint">
                Arrastra los elementos para cambiar su orden.
            </div>


            <div
                id="itemsList"
                class="elements-list"
            ></div>


            <div class="actions">

                <button
                    id="resetButton"
                    class="danger"
                >
                    Borrar todo
                </button>

            </div>

        </div>

    </div>

</div>


<script>
(function() {

    "use strict";


    const STORAGE_KEY =
        "photobox-generator-items-v4";


    let items = [];

    let editingIndex = -1;

    let dragState = null;


    function $(id) {
        return document.getElementById(id);
    }


    /*
     * ============================================================
     * UTILIDADES
     * ============================================================
     */

    function normalizeLineEndings(value) {

        return String(value ?? "")
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n");
    }


    function escapeHtmlText(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }


    function escapeHtmlAttribute(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }


    function capitalizeWords(value) {

        return String(value ?? "")
            .toLocaleLowerCase("es-ES")
            .replace(
                /(^|[\s\u00A0]+)([^\s\u00A0])/g,
                function(
                    match,
                    separator,
                    firstLetter
                ) {

                    return (
                        separator +
                        firstLetter.toLocaleUpperCase("es-ES")
                    );
                }
            );
    }


    /*
     * ============================================================
     * DIARY
     * ============================================================
     */

    function normalizeDiaryLine(line) {

        return String(line ?? "")
            .replace(
                /[\uFEFF\u200B\u200C\u200D\u2060]/g,
                ""
            )
            .replace(/\u00A0/g, " ")
            .trim();
    }


    function isDiarySeparator(line) {

        const normalized =
            normalizeDiaryLine(line);

        return (
            normalized === "..." ||
            normalized === "…" ||
            normalized === "⋯"
        );
    }


    function formatDiaryToHtml(text) {

        const lines =
            normalizeLineEndings(text).split("\n");

        const output = [];


        lines.forEach(function(line) {

            const normalized =
                normalizeDiaryLine(line);


            if (isDiarySeparator(normalized)) {

                output.push("<hr>");

                return;
            }


            if (!normalized) {
                return;
            }


            output.push(
                "<p>" +
                escapeHtmlText(normalized) +
                "</p>"
            );

        });


        return output.join("\n");
    }


    function importDiary(li) {

        const directChildren =
            Array.from(li.children);


        const hasDiaryStructure =
            directChildren.some(function(element) {

                const tag =
                    element.tagName.toLowerCase();

                return (
                    tag === "p" ||
                    tag === "hr"
                );
            });


        const hasDiaryMarker =
            directChildren.some(function(element) {

                return (
                    element.tagName.toLowerCase() === "img" &&
                    element.getAttribute("alt") === "Diario"
                );
            });


        if (
            !hasDiaryStructure &&
            !hasDiaryMarker
        ) {
            return null;
        }


        const parts = [];


        directChildren.forEach(function(element) {

            const tag =
                element.tagName.toLowerCase();


            if (tag === "p") {

                const clone =
                    element.cloneNode(true);


                clone.querySelectorAll("br")
                    .forEach(function(br) {

                        br.replaceWith(
                            document.createTextNode("\n")
                        );

                    });


                const text =
                    clone.textContent.trim();


                if (text) {

                    if (
                        isDiarySeparator(text)
                    ) {

                        parts.push("...");

                    } else {

                        parts.push(text);

                    }
                }
            }


            if (tag === "hr") {
                parts.push("...");
            }

        });


        if (!parts.length) {

            /*
             * El marcador Diario por sí solo
             * sigue siendo un Diary válido vacío.
             */
            if (hasDiaryMarker) {

                return {
                    type: "diary",
                    text: ""
                };

            }

            return null;
        }


        return {
            type: "diary",
            text: parts.join("\n")
        };
    }


    /*
     * ============================================================
     * FORMULARIO
     * ============================================================
     */

    function updateTypeFields() {

        const selectedType =
            $("elementType").value;


        const allFieldTypes = [
            "polaroid",
            "sticky",
            "sticky-fecha",
            "sticky-png",
            "ticket",
            "png-frame",
            "diary",
            "film-strip"
        ];


        allFieldTypes.forEach(function(type) {

            const group =
                $("fields-" + type);


            if (!group) {
                return;
            }


            group.classList.toggle(
                "hidden",
                type !== selectedType
            );

        });
    }


    function getFormData() {

        const type =
            $("elementType").value;


        /*
         * Este valor solo aparece mientras
         * se está editando un elemento vacío.
         */
        if (
            !type ||
            type === "__blank__"
        ) {
            return null;
        }


        if (type === "polaroid") {

            return {
                type: "polaroid",
                image:

            };

                    $("stickyFechaText").value,
                date:
                    $("stickyFechaDate").value
            };
        }


        if (type === "sticky-png") {

            return {
                type: "sticky-png",
                image:
                    $("stickyPngImage").value.trim(),
                alt:
                    $("stickyPngAlt").value
            };
        }


        if (type === "ticket") {

            return {
                type: "ticket",
                image:
                    $("ticketImage").value.trim(),
                alt:
                    $("ticketAlt").value
            };
        }


        if (type === "png-frame") {

            return {
                type: "png-frame",
                image:
                    $("pngFrameImage").value.trim(),
                alt:
                    $("pngFrameAlt").value,
                scale:
                    $("pngFrameScale").value || "1.4"
            };
        }


        if (type === "diary") {

            return {
                type: "diary",
                text:
                    $("diaryText").value
            };
        }


        if (type === "film-strip") {

            return {
                type: "film-strip",
                name:
                    $("filmName").value,

                images: [

                    {
                        image:
                            $("filmImage1").value.trim(),
                        alt:
                            $("filmAlt1").value
                    },

                    {
                        image:
                            $("filmImage2").value.trim(),
                        alt:
                            $("filmAlt2").value
                    },

                    {
                        image:
                            $("filmImage3").value.trim(),
                        alt:
                            $("filmAlt3").value
                    }

                ]
            };
        }


        return null;
    }


    function clearForm() {

        $("polaroidImage").value = "";
        $("polaroidAlt").value = "";
        $("polaroidText").value = "";

        $("stickyText").value = "";

        $("stickyFechaText").value = "";
        $("stickyFechaDate").value = "";

        $("stickyPngImage").value = "";
        $("stickyPngAlt").value = "";

        $("ticketImage").value = "";
        $("ticketAlt").value = "";

        $("pngFrameImage").value = "";
        $("pngFrameAlt").value = "";
        $("pngFrameScale").value = "1.4";

        $("diaryText").value = "";

        $("filmName").value = "";
        $("filmImage1").value = "";
        $("filmAlt1").value = "";
        $("filmImage2").value = "";
        $("filmAlt2").value = "";
        $("filmImage3").value = "";
        $("filmAlt3").value = "";


        editingIndex = -1;


        $("addButton").textContent =
            "Añadir elemento";


        $("cancelEditButton")
            .classList.add("hidden");

         * V1 empieza siempre mostrando Polaroid.
         */
